<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Calendar · Home Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub.css">
<style>
/* Calendar page: the shared Family Google Calendar. Week (default), month and list views, with the
   forecast on each day. Read-only; add and edit events in Google Calendar on your phone. */
.screen{display:flex;flex-direction:column;gap:var(--gap);max-width:1800px;margin:0 auto;min-height:100dvh;
  padding:calc(var(--gap) + env(safe-area-inset-top,0px)) var(--gap) calc(var(--gap) + 24px + env(safe-area-inset-bottom,0px))}
.head{flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(22px,2vw,30px);font-weight:700;letter-spacing:-.02em}
.head .sub{color:var(--text-muted);font-size:13px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.range{font-size:clamp(16px,1.3vw,20px);font-weight:600;min-width:12ch}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.seg button{border:0;background:none;height:32px;padding:0 14px;border-radius:9px;font-size:13px;color:var(--text-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.seg button:focus-visible{outline:2px solid var(--export);outline-offset:1px}
.btn{cursor:pointer;text-decoration:none}
.status{font-size:12.5px;color:var(--text-muted)} .status.err{color:var(--import)}

/* ---------- events ---------- */
.ev{display:block;width:100%;text-align:left;border:0;cursor:pointer;border-radius:8px;padding:6px 8px 6px 10px;
  background:color-mix(in srgb,var(--c,var(--gridout)) 14%,var(--surface-2));border-left:3px solid var(--c,var(--gridout));color:var(--text);font-size:13px;line-height:1.3}
.ev:hover{background:color-mix(in srgb,var(--c,var(--gridout)) 22%,var(--surface-2))}
.ev:focus-visible{outline:2px solid var(--export);outline-offset:1px}
.ev .t{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);display:block}
.ev b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.ev .loc{font-size:11.5px;color:var(--text-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.allday{background:color-mix(in srgb,var(--c,var(--gridout)) 32%,var(--surface-2));border-left-width:0;padding-left:8px}
.ev.past{opacity:.5}
.ev.now{box-shadow:inset 0 0 0 1px var(--c,var(--gridout))}

/* ---------- week ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;flex:1}
.cday{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:340px}
.cday.today{border-color:color-mix(in srgb,var(--gridout) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gridout) 40%,transparent)}
.cday.past{opacity:.72}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.dname{display:flex;flex-direction:column;line-height:1.15}
.dname small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.dname b{font-size:20px;font-weight:600}
.cday.today .dname small,.cday.today .dname b{color:var(--gridout)}
.dwx{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:13px;color:var(--text-muted)}
.dwx svg{width:26px;height:28px}
.dwx .rp{font-size:11px;color:var(--rain)}
.none{font-size:12.5px;color:var(--text-dim);padding:4px 2px}

/* ---------- month ---------- */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;flex:1}
.mdow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600;padding:0 6px}
.mcell{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;min-height:118px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.mcell:hover{border-color:var(--border-strong)}
.mcell.out{opacity:.4}
.mcell.today{border-color:color-mix(in srgb,var(--gridout) 70%,transparent)}
.mtop{display:flex;justify-content:space-between;align-items:center}
.mnum{font-size:14px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mcell.today .mnum{background:var(--gridout);color:#fff}
.mtop svg{width:20px;height:22px}
.mev{font-size:12px;line-height:1.25;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--c,var(--gridout)) 16%,transparent);border-left:2px solid var(--c,var(--gridout))}
.mev.allday{background:color-mix(in srgb,var(--c,var(--gridout)) 34%,transparent);border-left:0}
.mev .t{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);margin-right:4px}
.more{font-size:11.5px;color:var(--text-muted);padding-left:4px}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:10px;max-width:900px;width:100%}
.lday{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
.lday.today{border-color:color-mix(in srgb,var(--gridout) 70%,transparent)}
.lday .dname{gap:2px}
.lday .dwx{margin-top:6px}
.lev{display:flex;flex-direction:column;gap:6px}

/* ---------- detail dialog ---------- */
dialog{border:1px solid var(--border-strong);border-radius:18px;background:var(--surface);color:var(--text);padding:0;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;padding-left:12px;border-left:4px solid var(--c,var(--gridout))}
.dlg .row{font-size:14px;color:var(--text-muted)} .dlg .row b{color:var(--text);font-weight:500}
.dlg .dnotes{font-size:14px;white-space:pre-wrap;color:var(--text);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}

/* ---------- lock (only if a dashboard key is required) ---------- */
.lock{max-width:440px;margin:40px auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.lock input{height:44px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);padding:0 14px;font:inherit;font-size:16px}

/* ---------- smaller screens: the week becomes a list ---------- */
@media (max-width:1100px){
  .week{grid-template-columns:1fr}
  .cday{min-height:0;display:grid;grid-template-columns:96px minmax(0,1fr);align-items:start}
  .dhead{flex-direction:column;align-items:flex-start;border-bottom:0;padding-bottom:0}
  .mcell{min-height:84px} .mev{font-size:11px} .mev .t{display:none}
}
@media (max-width:640px){
  .mcell{min-height:56px;padding:4px} .mev{display:none} .mtop svg{display:none}
  .mcell .dotrow{display:flex}
  .lday{grid-template-columns:1fr}
  .seg button{padding:0 10px}
}
.dotrow{display:none;gap:3px;flex-wrap:wrap;padding-left:4px}
.dotrow i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--gridout))}
</style>
<script src="nav.js"></script>
</head>
<body>
<div class="screen" id="screen">
  <header class="head">
    <div class="head-left"><div><h1>Calendar</h1><div class="sub">Family calendar · Google Calendar, shared with Jas</div></div></div>
    <div class="head-right">
      <div class="dots" title="Data sources">
        <span class="dot" id="dot-cal"><i></i><b>CALENDAR</b></span>
        <span class="dot" id="dot-fc"><i></i><b>FORECAST</b></span>
      </div>
      <a class="btn" href="https://calendar.google.com/calendar/r" target="_blank" rel="noopener">Open Google Calendar ›</a>
    </div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="week" aria-pressed="true">Week</button>
      <button type="button" data-view="month" aria-pressed="false">Month</button>
      <button type="button" data-view="list" aria-pressed="false">List</button>
    </div>
    <button class="btn icon" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn" id="today" type="button">Today</button>
    <button class="btn icon" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="range" id="range" aria-live="polite"></div>
    <span class="status" id="status"></span>
  </div>

  <main id="view" aria-live="polite"><div class="empty">Loading the calendar…</div></main>
</div>

<dialog id="dlg" aria-labelledby="dlg-h"><div class="dlg" id="dlg-body"></div></dialog>

<script src="hub.js"></script>
<script>
(() => {
  const { $, esc, mel, TZ, fcDays, dayIcon, dayKind, calTime, until, hubKey, has } = Hub;
  // Google Calendar's event colours (colorId 1-11); events with no colour use the menu's purple
  const GCOL = { 1: '#7986cb', 2: '#33b679', 3: '#8e24aa', 4: '#e67c73', 5: '#f6bf26', 6: '#f4511e', 7: '#039be5', 8: '#8a8a8a', 9: '#5c6bc0', 10: '#0b8043', 11: '#d50000' };
  const colour = e => GCOL[e.color] || '';
  const API = '/.netlify/functions/calendar';

  // ---------- Melbourne date keys (YYYY-MM-DD) ----------
  const today = () => mel().key;
  const add = (k, n) => { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
  const dow = k => { const [y, m, d] = k.split('-').map(Number); return (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; };   // Mon = 0
  const monday = k => add(k, -dow(k));
  const firstOfMonth = k => k.slice(0, 8) + '01';
  const addMonths = (k, n) => { const [y, m] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 10); };
  const fmt = (k, o) => new Date(k + 'T12:00:00Z').toLocaleDateString('en-AU', { timeZone: 'UTC', ...o });

  // ---------- state ----------
  const qs = new URLSearchParams(location.search);
  let view = ['week', 'month', 'list'].includes(qs.get('view')) ? qs.get('view') : (innerWidth < 640 ? 'list' : 'week');
  let anchor = /^\d{4}-\d{2}-\d{2}$/.test(qs.get('date') || '') ? qs.get('date') : today();
  let data = null, loadedFor = '', locked = false, lastErr = '', loading = false;

  function span() {
    if (view === 'week') { const a = monday(anchor); return [a, add(a, 7)]; }
    if (view === 'month') { const a = monday(firstOfMonth(anchor)); return [a, add(a, 42)]; }
    return [anchor, add(anchor, 31)];
  }

  // ---------- data ----------
  async function load(force) {
    const [from, to] = span(), key = from + to;
    if (!force && key === loadedFor && data) return render();
    loading = true; renderStatus();
    try {
      const k = hubKey();
      const r = await fetch(`${API}?from=${from}&to=${to}`, { cache: 'no-store', signal: AbortSignal.timeout(20000), headers: k ? { 'x-hub-token': k } : {} });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { locked = true; data = null; }
      else if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
      else { locked = false; data = j; loadedFor = key; lastErr = ''; Hub.at.cal = Date.now(); Hub.failed.cal = false; }
    } catch (e) { lastErr = e.message; Hub.failed.cal = true; }
    loading = false;
    dotCal(); render();
  }
  function dotCal() {
    const el = $('dot-cal'); if (!el) return;
    el.className = 'dot ' + (Hub.failed.cal ? 'err' : Hub.at.cal ? 'ok' : '');
    el.title = Hub.at.cal ? 'Updated ' + Hub.ago(Hub.at.cal) : 'Loading';
  }

  // Events on a given day: all-day first, then timed by start
  function eventsOn(k) {
    if (!data) return [];
    return data.events.filter(e => e.allDay ? (e.start <= k && k < e.end) : Hub.evDay(e) === k)
      .sort((a, b) => (b.allDay - a.allDay) || (a.allDay ? a.title.localeCompare(b.title) : new Date(a.start) - new Date(b.start)));
  }
  const fcFor = k => fcDays().find(d => d.date === k);
  function wxHtml(k, small) {
    const d = fcFor(k); if (!d) return '';
    const rp = d.rainProb >= 30 ? `<span class="rp">${Math.round(d.rainProb)}%</span>` : '';
    return small ? dayIcon(dayKind(d)) : `<span class="dwx" title="${esc(Hub.KIND_TXT[dayKind(d)])}">${dayIcon(dayKind(d))}${has(d.tmax) ? Math.round(d.tmax) + '°' : ''}${rp}</span>`;
  }
  function evState(e) {
    const now = Date.now();
    if (e.allDay) return e.end <= today() ? 'past' : '';
    const s = new Date(e.start).getTime(), en = new Date(e.end).getTime();
    return en <= now ? 'past' : s <= now ? 'now' : '';
  }
  function evButton(e) {
    const c = colour(e), st = evState(e);
    const time = e.allDay ? '' : `<span class="t">${calTime(new Date(e.start))} – ${calTime(new Date(e.end))}</span>`;
    return `<button type="button" class="ev${e.allDay ? ' allday' : ''}${st ? ' ' + st : ''}" data-id="${esc(e.id)}" style="${c ? '--c:' + c : ''}">${time}<b>${esc(e.title)}</b>${e.location && !e.allDay ? `<span class="loc">${esc(e.location)}</span>` : ''}</button>`;
  }

  // ---------- views ----------
  function renderWeek() {
    const a = monday(anchor), t = today();
    let html = '<div class="week">';
    for (let i = 0; i < 7; i++) {
      const k = add(a, i), evs = eventsOn(k);
      html += `<section class="cday${k === t ? ' today' : k < t ? ' past' : ''}" aria-label="${esc(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }))}">
        <div class="dhead"><div class="dname"><small>${k === t ? 'Today' : fmt(k, { weekday: 'short' })}</small><b>${fmt(k, { day: 'numeric' })} <span style="font-size:13px;color:var(--text-muted);font-weight:500">${fmt(k, { month: 'short' })}</span></b></div>${wxHtml(k)}</div>
        <div class="lev">${evs.length ? evs.map(evButton).join('') : '<div class="none">Nothing on</div>'}</div></section>`;
    }
    $('range').textContent = `${fmt(a, { day: 'numeric', month: 'short' })} – ${fmt(add(a, 6), { day: 'numeric', month: 'short', year: 'numeric' })}`;
    return html + '</div>';
  }
  function renderMonth() {
    const first = firstOfMonth(anchor), a = monday(first), t = today(), mon = first.slice(0, 7);
    let html = '<div class="month">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="mdow">${d}</div>`).join('');
    const weeks = Math.ceil((dow(first) + new Date(Date.UTC(+mon.slice(0, 4), +mon.slice(5, 7), 0)).getUTCDate()) / 7);
    for (let i = 0; i < weeks * 7; i++) {
      const k = add(a, i), evs = eventsOn(k), show = evs.slice(0, 3);
      html += `<button type="button" class="mcell${k.slice(0, 7) !== mon ? ' out' : ''}${k === t ? ' today' : ''}" data-day="${k}" aria-label="${esc(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }))}, ${evs.length} event${evs.length === 1 ? '' : 's'}">
        <div class="mtop"><span class="mnum">${+k.slice(8)}</span>${wxHtml(k, true)}</div>
        ${show.map(e => `<div class="mev${e.allDay ? ' allday' : ''}" style="${colour(e) ? '--c:' + colour(e) : ''}">${e.allDay ? '' : `<span class="t">${calTime(new Date(e.start))}</span>`}${esc(e.title)}</div>`).join('')}
        ${evs.length > 3 ? `<div class="more">+${evs.length - 3} more</div>` : ''}
        <div class="dotrow">${evs.slice(0, 5).map(e => `<i style="${colour(e) ? '--c:' + colour(e) : ''}"></i>`).join('')}</div></button>`;
    }
    $('range').textContent = fmt(first, { month: 'long', year: 'numeric' });
    return html + '</div>';
  }
  function renderList() {
    const t = today(); let html = '<div class="list">', any = false;
    for (let i = 0; i < 31; i++) {
      const k = add(anchor, i), evs = eventsOn(k);
      if (!evs.length) continue;
      any = true;
      html += `<section class="lday${k === t ? ' today' : ''}"><div><div class="dname"><small>${k === t ? 'Today' : k === add(t, 1) ? 'Tomorrow' : fmt(k, { weekday: 'long' })}</small><b>${fmt(k, { day: 'numeric', month: 'short' })}</b></div>${wxHtml(k)}</div>
        <div class="lev">${evs.map(evButton).join('')}</div></section>`;
    }
    $('range').textContent = `Next 31 days from ${fmt(anchor, { day: 'numeric', month: 'short' })}`;
    return html + (any ? '' : '<div class="empty">Nothing on the calendar for the next month.</div>') + '</div>';
  }
  function renderLock() {
    return `<form class="lock" id="lockf"><h2 style="margin:0">This device needs the dashboard key</h2>
      <p class="status">Enter it once and this device will remember it.</p>
      <input type="password" id="lockk" autocomplete="current-password" aria-label="Dashboard key" required>
      <button class="btn" style="justify-content:center">Unlock</button></form>`;
  }
  function renderStatus() {
    const el = $('status');
    el.className = 'status' + (lastErr ? ' err' : '');
    el.textContent = loading ? 'Loading…' : lastErr ? `Couldn't load: ${lastErr}` : data ? `Updated ${Hub.clock(new Date(Hub.at.cal))}` : '';
  }
  function render() {
    renderStatus();
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
    if (locked) { $('view').innerHTML = renderLock(); $('range').textContent = ''; return; }
    if (!data) { if (lastErr) $('view').innerHTML = `<div class="empty">${esc(lastErr)}</div>`; return; }
    $('view').innerHTML = view === 'week' ? renderWeek() : view === 'month' ? renderMonth() : renderList();
  }

  // ---------- detail ----------
  function showEvent(id) {
    const e = data?.events.find(x => x.id === id); if (!e) return;
    const s = new Date(e.allDay ? e.start + 'T12:00:00' : e.start);
    let when;
    if (e.allDay) {
      const last = add(e.end, -1);
      when = last === e.start ? `${fmt(e.start, { weekday: 'long', day: 'numeric', month: 'long' })} · all day`
        : `${fmt(e.start, { weekday: 'short', day: 'numeric', month: 'short' })} – ${fmt(last, { weekday: 'short', day: 'numeric', month: 'short' })} · all day`;
    } else {
      const k = Hub.evDay(e), st = new Date(e.start).getTime(), soon = st > Date.now() ? ` · ${until(st - Date.now())}` : '';
      when = `${fmt(k, { weekday: 'long', day: 'numeric', month: 'long' })} · ${calTime(s)} – ${calTime(new Date(e.end))}${soon}`;
    }
    const map = e.location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location)}` : '';
    $('dlg-body').innerHTML = `<h3 id="dlg-h" style="${colour(e) ? '--c:' + colour(e) : ''}">${esc(e.title)}</h3>
      <div class="row"><b>${esc(when)}</b>${e.recurring ? ' · repeats' : ''}</div>
      ${e.location ? `<div class="row">📍 <a href="${map}" target="_blank" rel="noopener">${esc(e.location)}</a></div>` : ''}
      ${e.notes ? `<div class="dnotes">${esc(e.notes)}</div>` : ''}
      <div class="acts">${e.link ? `<a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">Edit in Google Calendar ›</a>` : ''}<button class="btn" type="button" id="dlg-close">Close</button></div>`;
    $('dlg').showModal();
    $('dlg-close').focus();
  }

  // ---------- events ----------
  function setUrl() { const p = new URLSearchParams(); if (view !== 'week') p.set('view', view); if (anchor !== today()) p.set('date', anchor); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : '')); }
  function go(v, a) { if (v) view = v; if (a) anchor = a; setUrl(); load(); }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
  const step = dir => view === 'week' ? add(anchor, 7 * dir) : view === 'month' ? addMonths(anchor, dir) : add(anchor, 31 * dir);
  $('prev').addEventListener('click', () => go(null, step(-1)));
  $('next').addEventListener('click', () => go(null, step(1)));
  $('today').addEventListener('click', () => go(null, today()));
  $('view').addEventListener('click', ev => {
    const b = ev.target.closest('.ev'); if (b) return showEvent(b.dataset.id);
    const c = ev.target.closest('.mcell'); if (c) go('week', c.dataset.cday);
  });
  $('view').addEventListener('submit', ev => {
    if (ev.target.id !== 'lockf') return;
    ev.preventDefault();
    try { localStorage.setItem('hubToken', $('lockk').value.trim()); } catch (e) {}
    load(true);
  });
  $('dlg').addEventListener('click', ev => { if (ev.target.id === 'dlg-close' || ev.target === $('dlg')) $('dlg').close(); });
  document.addEventListener('keydown', ev => {
    if ($('dlg').open || /input|textarea/i.test(ev.target.tagName)) return;
    if (ev.key === 'ArrowLeft') $('prev').click(); else if (ev.key === 'ArrowRight') $('next').click(); else if (ev.key === 't') $('today').click();
  });
  setInterval(() => { if (!document.hidden) load(true); }, 5 * 60e3);
  setInterval(() => { if (data && !$('dlg').open) render(); }, 60e3);   // keep "now" and past styling current
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });

  // The forecast (for the weather on each day) comes through the shared code
  Hub.start({ sources: ['fc'], extra: [() => { if (data) render(); }] });
  setUrl(); load();
})();
</script>
</body>
